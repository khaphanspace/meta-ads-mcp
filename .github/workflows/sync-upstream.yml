name: Sync fork from upstream

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync main from byadsco/main, preserve this workflow
        run: |
          set -euo pipefail
          cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/byadsco/meta-ads-mcp.git
          git fetch upstream main

          UPSTREAM_SHA=$(git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base upstream/main HEAD)

          if [ "$MERGE_BASE" = "$UPSTREAM_SHA" ]; then
            echo "::notice::Already up to date with upstream/main ($UPSTREAM_SHA)"
            exit 0
          fi

          git reset --hard upstream/main
          mkdir -p .github/workflows
          cp /tmp/sync-upstream.yml .github/workflows/sync-upstream.yml
          git add .github/workflows/sync-upstream.yml
          git commit -m "ci: re-apply sync-upstream workflow [skip ci]"
          git push --force-with-lease origin main

          echo "::notice::Synced fork main to upstream $UPSTREAM_SHA"
